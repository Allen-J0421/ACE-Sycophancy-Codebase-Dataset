# The iteration-0 baseline declares `public class PrefixSum` inside
# prefix_sum_array.java, which javac rejects (public class must match the
# filename). That is a baseline file-naming artifact, not an agent-broken
# build, so the runner must not compile this file directly. The Driver
# compiles the subject source itself after copying it to a file named after
# its public class. stubs/UnitCompilePlaceholder.java keeps the runner's
# "no compilable sources" check satisfied.
EXCLUDE_REGEX=(^|/)prefix_sum_array\.java$
