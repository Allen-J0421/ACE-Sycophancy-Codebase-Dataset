# The pristine baseline declares `public class DepthFirstSearch` inside
# depth_first_search.java; plain `javac depth_first_search.java` rejects the
# public-class/filename mismatch, which would score the untouched baseline
# COMPILE_ERROR (a tooling artifact, not an agent defect). So the runner skips
# the subject sources and the Driver compiles them itself, staging each file
# under the filename its public type requires. Uniform for all iterations; a
# genuinely broken build still fails (Driver reports the javac error).
EXCLUDE_REGEX=depth_first_search\.java
