# The iteration-0 baseline declares `public class BuildHeap` inside
# building_heap_from_array.java, which plain javac rejects (a public class
# must match its file name). That is a baseline file-naming artifact, not an
# agent-broken build, so the runner must not compile this file directly.
# The Driver compiles the subject sources itself, staging each file under the
# filename its public type requires (uniform across all iterations; a
# genuinely broken build still fails inside the Driver).
# stubs/DriverCompatPlaceholder.java keeps the runner's "no compilable
# sources" check satisfied.
EXCLUDE_REGEX=building_heap_from_array\.java
