# Simulator.java imports javafx.application.Application (only to launch the
# StatisticsView chart window), so the default javafx auto-exclusion would drop
# the Simulator itself. Instead: keep auto-exclusion off, exclude only the
# pure-JavaFX StatisticsView.java, and supply no-op stubs (stubs/) for
# javafx.application.Application and StatisticsView.
AUTO_EXCLUDE_IMPORTS=0
EXCLUDE_REGEX=(^|/)StatisticsView\.java$
# Simulator is inseparable from its Swing JFrame view (created in the ctor,
# used in simulateOneStep) -> must run NON-headless. --add-opens lets the driver
# seed java.lang.Math's internal Random (Gender.getRandom uses Math.random()).
JAVA_FLAGS=-Djava.awt.headless=false --add-opens java.base/java.lang=ALL-UNNAMED
RUN_TIMEOUT=300
