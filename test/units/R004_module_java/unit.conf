# Simulator is inseparable from its Swing JFrame view (created in the ctor,
# used in simulateOneStep/reset) -> must run NON-headless.
# -XX:hashCode=2 makes every identity hash constant (1). The baseline picks the
# weather via `new HashSet<>(RAINING,SUNNY,CLOUDY).toArray()[rand.nextInt(3)]`,
# whose order depends on enum identity hashes (random per JVM); with a constant
# hash the set iterates in insertion order (= WeatherType.values() order), so
# the otherwise fixed-seed simulation becomes fully deterministic and a golden
# trace can be used. The driver verifies the flag is in effect.
JAVA_FLAGS=-Djava.awt.headless=false -XX:+UnlockExperimentalVMOptions -XX:hashCode=2
RUN_TIMEOUT=300
