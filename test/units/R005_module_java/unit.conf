# R005 "Ultimate Simulator 3000" (Species -> Animal -> Predator, Plant; CSV-driven
# habitats/animals). Entry point Initializer opens the Swing MenuView and
# builds a JFrame SimulatorView used inside simulateOneStep -> must run
# non-headless. The driver disposes all windows and exits via System.exit.
# NON-deterministic baseline (Randomizer.useShared=false + Math.random), so the
# driver is a property suite (deterministic micro-scenarios + end-to-end
# invariants), not a golden trace.
JAVA_FLAGS=-Djava.awt.headless=false
RUN_TIMEOUT=300
