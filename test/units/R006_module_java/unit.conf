# R006 tundra sim (Bear/CarnivoreFox/Wolverine + Reindeer/Sheep, Grass/Sage/Sedge).
# Dashboard.java imports javafx (auto-excluded) but Simulator/SimulatorView
# reference it -> replace it with the no-op stub in stubs/ (STUB_OVERRIDE so the
# stub wins over the subject's JavaFX file; no model class is stubbed).
# Simulator is inseparable from its Swing JFrame view (SimulatorView created in
# the constructor, used inside simulateOneStep) -> must run non-headless. The
# driver disposes all windows and exits via System.exit.
STUB_OVERRIDE=1
JAVA_FLAGS=-Djava.awt.headless=false
RUN_TIMEOUT=300
