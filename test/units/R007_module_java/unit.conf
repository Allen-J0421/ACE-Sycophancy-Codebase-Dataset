# R007 aquatic ecosystem simulation (Creature -> Animal/Seaweed).
# The real SimulatorView is a JFrame; replace it everywhere with the headless
# stub in stubs/ so the model layer can run under java.awt.headless=true.
STUB_OVERRIDE=1
RUN_TIMEOUT=240
# --add-opens lets the driver seed Math.random()'s generator (reproducibility
# aid only; the oracle is property-based and does not depend on the trace).
JAVA_FLAGS=-Djava.awt.headless=true --add-opens java.base/java.lang=ALL-UNNAMED
