# Simulator is inseparable from its Swing JFrame view at the baseline
# (SimulatorView created in the Simulator constructor, setVisible(true),
# used inside simulateOneStep) -> must run non-headless. The driver
# disposes all windows and exits via System.exit.
# simulate(100) includes a built-in delay(20) per step (~2s per rep, 3 reps).
JAVA_FLAGS=-Djava.awt.headless=false
RUN_TIMEOUT=300
